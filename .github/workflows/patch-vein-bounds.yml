name: Patch vein bounds

on:
  push:
    branches: [ feature/experimental-ore-deposit-placement ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/experimental-ore-deposit-placement

      - name: Include vein caps and lock regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          geometry = Path('src/main/java/com/geostrata/geology/OreDepositGeometry.java')
          text = geometry.read_text()
          old = '''            double minAlong = -lengthRadius;
            double maxAlong = lengthRadius;
            double minAcross = -widthRadius;
            double maxAcross = widthRadius;
            double minNormal = -thicknessRadius;
            double maxNormal = thicknessRadius;

            if ("vein".equals(style)) {'''
          new = '''            boolean vein = "vein".equals(style);
            double minAlong = -lengthRadius - (vein ? thicknessRadius : 0.0);
            double maxAlong = lengthRadius + (vein ? thicknessRadius : 0.0);
            double minAcross = -widthRadius;
            double maxAcross = widthRadius;
            double minNormal = -thicknessRadius;
            double maxNormal = thicknessRadius;

            if (vein) {'''
          if text.count(old) != 1:
              raise SystemExit('expected one vein local-bounds block')
          geometry.write_text(text.replace(old, new))

          test = Path('src/test/java/com/geostrata/geology/OreDepositGeometryTest.java')
          text = test.read_text()
          marker = '''    @Test
    void economicBodyFadesIntoNonEconomicTraceThenOutside() {'''
          regression = '''    @Test
    void conservativeBoundsContainEverySampledVeinCapVoxel() {
        OreDepositGeometry.Body body = OreDepositGeometry.forCandidate(42L, candidate("vein"));
        OreDepositGeometry.Bounds bounds = body.bounds();
        int margin = 4;

        for (int x = bounds.minX() - margin; x <= bounds.maxX() + margin; x++) {
            for (int y = bounds.minY() - margin; y <= bounds.maxY() + margin; y++) {
                for (int z = bounds.minZ() - margin; z <= bounds.maxZ() + margin; z++) {
                    if (body.sample(x, y, z).economic()) {
                        assertTrue(bounds.contains(x, y, z), "economic vein voxel escaped conservative bounds");
                    }
                }
            }
        }
    }

    @Test
    void economicBodyFadesIntoNonEconomicTraceThenOutside() {'''
          if text.count(marker) != 1:
              raise SystemExit('expected one geometry fade test marker')
          test.write_text(text.replace(marker, regression))
          PY

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-vein-bounds.yml
          git add src/main/java/com/geostrata/geology/OreDepositGeometry.java \
                  src/test/java/com/geostrata/geology/OreDepositGeometryTest.java
          git commit -m "Include vein end caps in deposit bounds"
          git push origin HEAD:feature/experimental-ore-deposit-placement
