name: Patch vein bounds

on:
  push:
    branches: [ feature/experimental-ore-deposit-placement ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/experimental-ore-deposit-placement

      - name: Include vein caps and lock regression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          geometry = Path('src/main/java/com/geostrata/geology/OreDepositGeometry.java')
          text = geometry.read_text()
          old = (
              '            double minAlong = -lengthRadius;\n'
              '            double maxAlong = lengthRadius;\n'
              '            double minAcross = -widthRadius;\n'
              '            double maxAcross = widthRadius;\n'
              '            double minNormal = -thicknessRadius;\n'
              '            double maxNormal = thicknessRadius;\n\n'
              '            if ("vein".equals(style)) {'
          )
          new = (
              '            boolean vein = "vein".equals(style);\n'
              '            double minAlong = -lengthRadius - (vein ? thicknessRadius : 0.0);\n'
              '            double maxAlong = lengthRadius + (vein ? thicknessRadius : 0.0);\n'
              '            double minAcross = -widthRadius;\n'
              '            double maxAcross = widthRadius;\n'
              '            double minNormal = -thicknessRadius;\n'
              '            double maxNormal = thicknessRadius;\n\n'
              '            if (vein) {'
          )
          if text.count(old) != 1:
              raise SystemExit('expected one vein local-bounds block')
          geometry.write_text(text.replace(old, new))

          test = Path('src/test/java/com/geostrata/geology/OreDepositGeometryTest.java')
          text = test.read_text()
          marker = (
              '    @Test\n'
              '    void economicBodyFadesIntoNonEconomicTraceThenOutside() {'
          )
          regression = (
              '    @Test\n'
              '    void conservativeBoundsContainEverySampledVeinCapVoxel() {\n'
              '        OreDepositGeometry.Body body = OreDepositGeometry.forCandidate(42L, candidate("vein"));\n'
              '        OreDepositGeometry.Bounds bounds = body.bounds();\n'
              '        int margin = 4;\n\n'
              '        for (int x = bounds.minX() - margin; x <= bounds.maxX() + margin; x++) {\n'
              '            for (int y = bounds.minY() - margin; y <= bounds.maxY() + margin; y++) {\n'
              '                for (int z = bounds.minZ() - margin; z <= bounds.maxZ() + margin; z++) {\n'
              '                    if (body.sample(x, y, z).economic()) {\n'
              '                        assertTrue(bounds.contains(x, y, z), "economic vein voxel escaped conservative bounds");\n'
              '                    }\n'
              '                }\n'
              '            }\n'
              '        }\n'
              '    }\n\n'
              '    @Test\n'
              '    void economicBodyFadesIntoNonEconomicTraceThenOutside() {'
          )
          if text.count(marker) != 1:
              raise SystemExit('expected one geometry fade test marker')
          test.write_text(text.replace(marker, regression))
          PY

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-vein-bounds.yml
          git add src/main/java/com/geostrata/geology/OreDepositGeometry.java \
                  src/test/java/com/geostrata/geology/OreDepositGeometryTest.java
          git commit -m "Include vein end caps in deposit bounds"
          git push origin HEAD:feature/experimental-ore-deposit-placement
