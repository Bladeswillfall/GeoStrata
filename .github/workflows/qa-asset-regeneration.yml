name: Regenerate in-game QA assets

on:
  push:
    branches:
      - fix/in-game-qa-20260901
    paths:
      - scripts/regenerate_in_game_qa_assets.py
      - .github/workflows/qa-asset-regeneration.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Regenerate and validate assets
        run: python3 scripts/regenerate_in_game_qa_assets.py

      - name: Commit regenerated assets
        run: |
          git restore -- .github/workflows/build.yml .github/workflows/qa-asset-regeneration.yml scripts/regenerate_in_game_qa_assets.py
          rm -rf scripts/__pycache__
          if git diff --quiet && git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate Continuity assets from in-game QA"
          git push origin HEAD:${GITHUB_REF_NAME}
