name: Patch ore diagnostics

on:
  push:
    branches: [ feature/experimental-ore-deposit-placement ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/experimental-ore-deposit-placement

      - name: Update ore diagnostic wording
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/geostrata/command/GeoStrataCommands.java')
          text = path.read_text()

          replacements = [
              (
                  'import com.geostrata.geology.OreDepositGeometry;\n',
                  'import com.geostrata.geology.OreDepositExperiment;\n'
                  'import com.geostrata.geology.OreDepositGeometry;\n',
              ),
              (
                  '+ " | grade blocks/drops active; deposit placement and native suppression inactive"',
                  '+ (OreDepositExperiment.current().enabled()\n'
                  '                                        ? " | EXPERIMENTAL deposit placement enabled; native suppression inactive"\n'
                  '                                        : " | deposit experiment disabled; native suppression inactive")',
              ),
              ('? "ELIGIBLE geometry preview"', '? "anchor-qualified geometry preview"'),
              (': "ineligible: " + candidateRejection', ': "anchor diagnostic: " + candidateRejection'),
              (
                  '.orElse("body unavailable until host and province qualify");',
                  '.orElse("anchor-preview unavailable until host and province qualify");',
              ),
              (
                  '+ " | preview only; no deposit placement or native suppression"',
                  '+ (OreDepositExperiment.current().enabled()\n'
                  '                                        ? " | experiment enabled; runtime placement uses province + local-host clipping; native suppression inactive"\n'
                  '                                        : " | preview only; deposit experiment disabled; native suppression inactive")',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Commit diagnostic fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-ore-diagnostics.yml
          git add src/main/java/com/geostrata/command/GeoStrataCommands.java
          git commit -m "Report experimental ore placement accurately"
          git push origin HEAD:feature/experimental-ore-deposit-placement
