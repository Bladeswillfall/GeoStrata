name: Core common ore ownership benchmark

on:
  pull_request:
    paths:
      - '.github/workflows/core-ore-readiness.yml'
      - 'src/main/java/com/geostrata/block/GeoStrataBlocks.java'
      - 'src/main/java/com/geostrata/block/GradedOreBlock.java'
      - 'src/main/java/com/geostrata/block/OreHost.java'
      - 'src/main/java/com/geostrata/command/OreDistributionBenchmarkCommands.java'
      - 'src/main/java/com/geostrata/geology/**'
      - 'src/main/java/com/geostrata/platform/fabric/**'
      - 'src/main/java/com/geostrata/worldgen/**'
      - 'src/main/resources/data/geostrata/geology/**'
      - 'src/main/resources/data/geostrata/worldgen/**'

permissions:
  contents: read

jobs:
  core-ore-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 for Gradle and Loom
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0

      - name: Build core mod
        run: gradle build --stacktrace

      - name: Prepare dedicated server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/results
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          level-name=geostrata-core-ore-readiness
          level-seed=8675309
          level-type=minecraft:normal
          online-mode=false
          spawn-protection=0
          view-distance=2
          simulation-distance=2
          max-tick-time=-1
          enable-command-block=false
          EOF

      - name: Benchmark paired baseline and production core ownership
        shell: bash
        run: |
          set -euo pipefail

          run_scenario() {
              scenario="$1"
              rm -rf run/geostrata-core-ore-readiness run/logs
              unset GEOSTRATA_BENCHMARK_DISABLE_CORE_COMMON_ORE_OWNERSHIP || true
              if [ "$scenario" = baseline ]; then
                  export GEOSTRATA_BENCHMARK_DISABLE_CORE_COMMON_ORE_OWNERSHIP=true
              fi

              fifo="run/${scenario}.console"
              rm -f "$fifo"
              mkfifo "$fifo"
              exec 3<>"$fifo"
              setsid gradle :runServer --stacktrace <"$fifo" >"run/results/${scenario}.stdout.log" 2>&1 &
              pid=$!

              started=0
              for _ in $(seq 1 240); do
                  if [ -f run/logs/latest.log ] && grep -q 'Done (' run/logs/latest.log; then
                      started=1
                      break
                  fi
                  if ! kill -0 "$pid" 2>/dev/null; then
                      echo "Minecraft server exited before startup for ${scenario}."
                      cat "run/results/${scenario}.stdout.log"
                      [ -f run/logs/latest.log ] && cat run/logs/latest.log
                      exit 1
                  fi
                  sleep 2
              done
              if [ "$started" -ne 1 ]; then
                  echo "Minecraft server did not reach Done for ${scenario}."
                  kill -TERM -- "-$pid" 2>/dev/null || true
                  exit 1
              fi

              python3 - "$scenario" <<'PY'
          import pathlib
          import re
          import sys

          scenario = sys.argv[1]
          text = pathlib.Path('run/logs/latest.log').read_text(errors='replace')
          matches = re.findall(r'Done \(([0-9]+(?:\.[0-9]+)?)s\)', text)
          if not matches:
              raise SystemExit(f'Could not parse Minecraft Done time for {scenario}')
          pathlib.Path(f'run/results/{scenario}.startup-seconds.txt').write_text(f'{float(matches[-1]):.3f}\n')
          PY

              printf 'geostrata ore benchmark -44\n' >&3
              found=0
              for _ in $(seq 1 360); do
                  if grep -q 'GEOSTRATA_ORE_BENCHMARK ' run/logs/latest.log; then
                      found=1
                      break
                  fi
                  if ! kill -0 "$pid" 2>/dev/null; then
                      echo "Minecraft server exited during benchmark for ${scenario}."
                      cat "run/results/${scenario}.stdout.log"
                      cat run/logs/latest.log
                      exit 1
                  fi
                  sleep 2
              done
              if [ "$found" -ne 1 ]; then
                  echo "Ore benchmark did not complete for ${scenario}."
                  cat run/logs/latest.log
                  kill -TERM -- "-$pid" 2>/dev/null || true
                  exit 1
              fi

              python3 - "$scenario" <<'PY'
          import json
          import pathlib
          import sys

          scenario = sys.argv[1]
          marker = 'GEOSTRATA_ORE_BENCHMARK '
          lines = pathlib.Path('run/logs/latest.log').read_text(errors='replace').splitlines()
          payload = next(line.split(marker, 1)[1] for line in reversed(lines) if marker in line)
          pathlib.Path(f'run/results/{scenario}.json').write_text(
              json.dumps(json.loads(payload), indent=2) + '\n'
          )
          PY

              cp run/logs/latest.log "run/results/${scenario}.latest.log"
              printf 'stop\n' >&3
              wait "$pid" || true
              exec 3>&-
              rm -f "$fifo"
          }

          run_scenario baseline
          run_scenario core

      - name: Summarize production ownership readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(Path('run/results/baseline.json').read_text())
          core = json.loads(Path('run/results/core.json').read_text())
          baseline_startup = float(Path('run/results/baseline.startup-seconds.txt').read_text())
          core_startup = float(Path('run/results/core.startup-seconds.txt').read_text())
          startup_ratio = core_startup / baseline_startup
          maximum_startup_ratio = 2.5
          common = ('coal', 'iron', 'copper')
          rows = {}
          failures = []

          if startup_ratio > maximum_startup_ratio:
              failures.append(
                  f'core startup ratio {startup_ratio:.2f}x exceeds {maximum_startup_ratio:.2f}x budget'
              )

          for material in common:
              before = baseline['materials'][material]
              after = core['materials'][material]
              vanilla_patches = before['vanillaTaggedAirExposedClusters']
              core_patches = after['gradedAirExposedClusters']
              target = (vanilla_patches + 1) // 2
              ratio = 0.0 if vanilla_patches == 0 else core_patches * 100.0 / vanilla_patches

              if before['vanillaTaggedBlocks'] == 0:
                  failures.append(f'{material}: paired baseline did not retain vanilla generation')
              if after['vanillaTaggedBlocks'] != 0:
                  failures.append(f'{material}: production core left residual vanilla generation')
              if core_patches < target:
                  failures.append(f'{material}: {core_patches} < {target} exposed-patch floor')

              rows[material] = {
                  'baselineVanillaTotal': before['vanillaTaggedBlocks'],
                  'coreGradedTotal': after['gradedBlocks'],
                  'coreResidualVanillaTotal': after['vanillaTaggedBlocks'],
                  'baselineVanillaExposedPatches': vanilla_patches,
                  'coreGradedExposedPatches': core_patches,
                  'patchPercentOfBaseline': ratio,
                  'minimumTarget': target,
              }

          summary = {
              'seed': baseline['seed'],
              'chunkMin': baseline['chunkMin'],
              'chunkMax': baseline['chunkMax'],
              'chunkCount': baseline['chunkCount'],
              'startup': {
                  'baselineSeconds': baseline_startup,
                  'coreSeconds': core_startup,
                  'ratio': startup_ratio,
                  'maximumRatio': maximum_startup_ratio,
              },
              'materials': rows,
          }
          Path('run/results/core-readiness.json').write_text(json.dumps(summary, indent=2) + '\n')

          lines = [
              '# Production core common ore ownership',
              '',
              f"Seed: {summary['seed']} | chunks: {summary['chunkCount']} (10x10) | chunk range: {summary['chunkMin']}..{summary['chunkMax']}",
              '',
              f"Startup: paired baseline {baseline_startup:.3f}s | production core {core_startup:.3f}s | {startup_ratio:.2f}x (budget <= {maximum_startup_ratio:.2f}x)",
              '',
              '| Material | Baseline vanilla | Core graded | Residual vanilla | Baseline exposed patches | Core graded patches | % of baseline | 50% floor |',
              '|---|---:|---:|---:|---:|---:|---:|:---:|',
          ]
          for material, row in rows.items():
              lines.append(
                  f"| {material} | {row['baselineVanillaTotal']} | {row['coreGradedTotal']} | "
                  f"{row['coreResidualVanillaTotal']} | {row['baselineVanillaExposedPatches']} | "
                  f"{row['coreGradedExposedPatches']} | {row['patchPercentOfBaseline']:.1f}% | "
                  f"{'yes' if row['coreGradedExposedPatches'] >= row['minimumTarget'] else 'no'} |"
              )
          lines.extend([
              '',
              'Production acceptance: core-only GeoStrata must replace vanilla coal/iron/copper completely while retaining at least 50% of the paired baseline exposed-patch count for each material.',
              'The paired baseline uses a CI-only Fabric switch to disable both core common-ore activation and suppression; normal players do not use this switch.',
          ])
          report = '\n'.join(lines) + '\n'
          Path('run/results/core-readiness.md').write_text(report)
          print(report)
          if failures:
              raise SystemExit('Core common ore ownership acceptance failed: ' + '; '.join(failures))
          PY
          cat run/results/core-readiness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload readiness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geostrata-core-common-ore-ownership
          path: run/results/*
          if-no-files-found: warn
