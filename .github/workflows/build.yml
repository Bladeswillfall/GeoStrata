name: Build GeoStrata

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate development pack contract
        run: python3 scripts/validate_pack_manifest.py

      - name: Validate geology catalog
        run: python3 scripts/validate_geology_catalog.py

      - name: Validate optional integration data
        run: python3 scripts/validate_optional_integrations.py

      - name: Set up Java 21 for Gradle and Loom
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 9.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.0

      - name: Build Java 17 mod artifacts
        run: gradle clean build :experiment-companion:build --stacktrace

      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: geostrata-jars
          path: |
            build/libs/*.jar
            experiment-companion/build/libs/*.jar
          if-no-files-found: error
