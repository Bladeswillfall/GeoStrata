name: Regenerate ore CTM assets

on:
  push:
    branches: [ fix/continuity-ctm-resource-paths ]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/continuity-ctm-resource-paths

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Regenerate compact ore CTM assets
        run: python scripts/generate_ore_continuity_tilesets.py

      - name: Validate generated CTM assets
        run: python scripts/validate_ore_continuity_tilesets.py

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/main/resources/assets/geostrata/optifine/ctm/ore \
            src/main/resources/assets/geostrata/textures/optifine/ctm/ore \
            src/main/resources/data/geostrata/materials/ore_ctm_manifest.json \
            docs/images/ore-ctm-tileset-preview.png
          if git diff --cached --quiet; then
            echo 'Generated CTM assets are already current.'
            exit 0
          fi
          git commit -m 'Regenerate seamless ore CTM assets'
          git push origin HEAD:fix/continuity-ctm-resource-paths
