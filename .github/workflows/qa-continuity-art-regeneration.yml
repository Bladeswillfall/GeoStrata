name: Regenerate Continuity art QA assets

on:
  push:
    branches:
      - fix/continuity-art-polish-20260901
    paths:
      - scripts/generate_host_continuity_transitions.py
      - scripts/validate_host_continuity_transitions.py
      - scripts/generate_ore_continuity_tilesets.py
      - .github/workflows/qa-continuity-art-regeneration.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate and validate Continuity resources
        run: |
          python3 scripts/generate_host_continuity_transitions.py
          python3 scripts/generate_ore_continuity_tilesets.py
          python3 scripts/validate_ore_continuity_tilesets.py

      - name: Commit generated resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/resources/assets/geostrata/optifine/ctm/_host_transitions \
            src/main/resources/assets/geostrata/textures/optifine/ctm/host_transition \
            src/main/resources/assets/geostrata/optifine/ctm/ore \
            src/main/resources/assets/geostrata/textures/optifine/ctm/ore \
            src/main/resources/data/geostrata/materials/ore_ctm_manifest.json \
            docs/images/ore-ctm-tileset-preview.png
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate polished Continuity textures"
          git push origin HEAD:${GITHUB_REF_NAME}
