plugins {
    id 'fabric-loom' version '1.16.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

def worldgenTargetContracts = [
        'geostrata:worldgen/base_stone_replaceables': [
                'limestone_ore', 'chalk_ore', 'shale_ore', 'slate_ore', 'mudstone_ore', 'siltstone_ore',
                'marble_ore', 'quartzite_ore', 'schist_ore', 'gneiss_ore', 'basalt_ore', 'rhyolite_ore',
                'conglomerate_ore', 'breccia_ore'
        ],
        'geostrata:worldgen/soil_replaceables': ['sandy_loam_patch', 'silty_loam_patch', 'peat_soil_patch'],
        'geostrata:worldgen/mud_replaceables': ['wet_mud_patch', 'compacted_mud_patch'],
        'geostrata:worldgen/clay_replaceables': ['clay_loam_patch', 'blue_clay_patch', 'red_clay_patch']
]

tasks.register('validateWorldgenCompatibilityContracts') {
    group = 'verification'
    description = 'Ensures baseline GeoStrata worldgen uses extensible replacement tags.'

    doLast {
        worldgenTargetContracts.each { expectedTag, features ->
            features.each { feature ->
                def featureFile = file("src/main/resources/data/geostrata/worldgen/configured_feature/${feature}.json")
                if (!featureFile.isFile()) {
                    throw new GradleException("Missing configured feature: ${featureFile}")
                }

                def json = new groovy.json.JsonSlurper().parse(featureFile)
                def targets = json?.config?.targets
                if (!(targets instanceof List) || targets.isEmpty()) {
                    throw new GradleException("Configured feature ${feature} has no targets")
                }

                def invalidTargets = targets.findAll { entry ->
                    entry?.target?.get('predicate_type') != 'minecraft:tag_match' || entry?.target?.tag != expectedTag
                }
                if (!invalidTargets.isEmpty()) {
                    throw new GradleException("Configured feature ${feature} must target ${expectedTag}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('validateWorldgenCompatibilityContracts')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
