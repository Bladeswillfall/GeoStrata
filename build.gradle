plugins {
    id 'fabric-loom' version '1.16.3'
    id 'pmd'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

pmd {
    toolVersion = '7.16.0'
    consoleOutput = true
    ignoreFailures = false
    ruleSets = []
    ruleSetConfig = resources.text.fromFile('config/pmd/geostrata-complexity.xml')
}

// Complexity lint is a production-code guardrail. Tests are intentionally excluded so
// parameterized/branch-heavy regression cases are not pressured into artificial splitting.
tasks.named('pmdTest') {
    enabled = false
}

tasks.named('pmdMain') {
    reports {
        xml.required = true
        html.required = true
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand(version: project.version)
    }
}

def worldgenTargetContracts = [
        'geostrata:worldgen/base_stone_replaceables': [
                'limestone_ore', 'chalk_ore', 'shale_ore', 'slate_ore', 'mudstone_ore', 'siltstone_ore',
                'marble_ore', 'quartzite_ore', 'schist_ore', 'gneiss_ore', 'basalt_ore', 'rhyolite_ore',
                'conglomerate_ore', 'breccia_ore'
        ],
        'geostrata:worldgen/soil_replaceables': ['sandy_loam_patch', 'silty_loam_patch', 'peat_soil_patch'],
        'geostrata:worldgen/mud_replaceables': ['wet_mud_patch', 'compacted_mud_patch'],
        'geostrata:worldgen/clay_replaceables': ['clay_loam_patch'],
        'geostrata:worldgen/hydric_sediment_replaceables': ['blue_clay_patch', 'red_clay_patch']
]

tasks.register('validateWorldgenCompatibilityContracts') {
    group = 'verification'
    description = 'Ensures baseline GeoStrata worldgen uses extensible replacement tags.'

    doLast {
        worldgenTargetContracts.each { expectedTag, features ->
            features.each { feature ->
                def featureFile = file("src/main/resources/data/geostrata/worldgen/configured_feature/${feature}.json")
                if (!featureFile.isFile()) {
                    throw new GradleException("Missing configured feature: ${featureFile}")
                }

                def json = new groovy.json.JsonSlurper().parse(featureFile)
                def targets = json?.config?.targets
                if (targets instanceof List && !targets.isEmpty()) {
                    def invalidTargets = targets.findAll { entry ->
                        entry?.target?.get('predicate_type') != 'minecraft:tag_match' || entry?.target?.tag != expectedTag
                    }
                    if (!invalidTargets.isEmpty()) {
                        throw new GradleException("Configured feature ${feature} must target ${expectedTag}")
                    }
                    return
                }

                def target = json?.config?.target
                if (json?.type != 'minecraft:disk'
                        || target?.type != 'minecraft:matching_block_tag'
                        || target?.tag != expectedTag) {
                    throw new GradleException("Configured feature ${feature} must target ${expectedTag}")
                }
            }
        }
    }
}

tasks.register('validateGeologyContactOwnership') {
    group = 'verification'
    description = 'Ensures core rock bodies replace only vanilla host stone and never earlier GeoStrata geology.'

    doLast {
        def tagFile = file('src/main/resources/data/geostrata/tags/blocks/worldgen/base_stone_replaceables.json')
        if (!tagFile.isFile()) {
            throw new GradleException("Missing core base-stone replacement tag: ${tagFile}")
        }

        def json = new groovy.json.JsonSlurper().parse(tagFile)
        def values = json?.values
        def expectedHosts = [
                '#minecraft:stone_ore_replaceables',
                '#minecraft:deepslate_ore_replaceables'
        ]

        if (!(values instanceof List) || values.size() != expectedHosts.size() || values.toSet() != expectedHosts.toSet()) {
            throw new GradleException(
                    'Core geostrata:worldgen/base_stone_replaceables must contain exactly the two vanilla ore-replaceable tags. '
                            + 'GeoStrata rocks must stay out of this default tag so intersecting geological bodies cannot overwrite one another; '
                            + 'third-party host stones belong in additive compatibility datapacks.'
            )
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('validateWorldgenCompatibilityContracts')
    dependsOn tasks.named('validateGeologyContactOwnership')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
